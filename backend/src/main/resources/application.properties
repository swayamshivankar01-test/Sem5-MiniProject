spring.application.name=roz-ka-khata

# ---------- Database (PostgreSQL) ----------
# Set these as environment variables. DB_PASSWORD has no default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rozkakhata}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" creates the tables (users, expenses) on first start and adds missing columns later.
# Fine for learning/development. For production prefer "validate" + a migration tool (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# JWT_SECRET is REQUIRED (no default) and must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (default 24 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Comma-separated list of origins that may call this API from a browser.
# Default covers common local static servers. Add your deployed frontend URL here later.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000}

server.port=${PORT:8080}

# We authenticate with JWT, so Spring's auto-generated in-memory "user" + console password is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
